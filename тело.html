body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EEEEF2;color:#151515;

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(data,pw){
  const raw=b64(data); if(new TextDecoder().decode(raw.slice(0,8))!=='Salted__') throw new Error('формат');
  const salt=raw.slice(8,16), ct=raw.slice(16);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
  return new TextDecoder().decode(pt);
}
function блок(код){const b=БЛОКИ.find(x=>x.к===код);if(!b)throw new Error('нет блока');return b.d}
async function показать(pw,код,режим,репро){
  const html=await decrypt(блок(код),pw);
  try{
    sessionStorage.setItem('hh-pw',pw);
    if(режим){sessionStorage.setItem('hh-режим',режим)}else{sessionStorage.removeItem('hh-режим')}
    if(репро){sessionStorage.setItem('hh-pw-репро',репро)}else{sessionStorage.removeItem('hh-pw-репро')}
  }catch(e){}
  document.open();document.write(html);document.close();
}
function форма(текст){
  document.getElementById('ожидание').hidden=true;
  const f=document.getElementById('f');f.hidden=false;
  if(текст){const e=document.getElementById('err');e.textContent=текст;e.style.display='block'}
  const p=document.getElementById('pw');if(p)p.focus();
}
/* ключи из адреса: #врач&k=<ключ врача> или #врач&k=<ключ врача>.<ключ спермограммы> */
function ключиИзАдреса(){
  let h=location.hash||'';try{h=decodeURIComponent(h)}catch(e){}
  const m=/[#&]k=([A-Za-z0-9_.\-]+)/.exec(h);
  return m?m[1].split('.').filter(Boolean):null;
}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  try{await показать(document.getElementById('pw').value,1,'',''); }
  catch(err){const d=document.getElementById('err');d.textContent='Неверный пароль';d.style.display='block'}
};
(async()=>{
  const kk=ключиИзАдреса();
  if(kk){
    try{ await показать(kk[0],3,'врач',kk[1]||''); return; }
    catch(e){ форма('Ссылка недействительна или отозвана. Попросите новую.'); return; }
  }
  try{
    const pw=sessionStorage.getItem('hh-pw'), режим=sessionStorage.getItem('hh-режим');
    if(pw){
      try{ await показать(pw,режим==='врач'?3:1,режим||'',sessionStorage.getItem('hh-pw-репро')||''); return; }
      catch(e){}
    }
  }catch(e){}
  форма('');
})();
</script></body></html>
